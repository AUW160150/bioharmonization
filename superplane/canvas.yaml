# BioGrid — SuperPlane canvas (DEMO: self-contained mini automation)
# ----------------------------------------------------------------------------
# Paste this into the YAML editor of your `galactic-nova` canvas and save.
# It needs NO integrations — every step is an HTTP call to your live Render
# app plus `if` gates, so it runs on its own and visibly lights up.
#
# Flow:  Run on demand ─▶ health check ─▶ [healthy?] ─▶ run pipeline
#                   ─▶ wait(30s) ─▶ check status ─▶ [complete?] ─▶ done
#
# NOTE: this file documents the working design. The live canvas in SuperPlane
# Cloud is the source of truth. A MANUAL "Run on demand" trigger is used (not a
# schedule) — the 5-min schedule created overlapping runs that polluted the
# shared /api/pipeline/status/latest, so one manual run at a time keeps the
# chain deterministic.
#
# After Render is live, if your URL isn't exactly biogrid-bioharmonize.onrender.com,
# tell me and I'll rewrite the URLs. (The integration-rich version with
# Claude + open-PR + render.deploy lives in workflow.yaml as the roadmap.)
# ----------------------------------------------------------------------------
apiVersion: v1
kind: Canvas
metadata:
  id: 55f4f453-984a-4f03-b3f0-60d5c78f7617
  name: galactic-nova
  description: "BioGrid mini automation — drives the live BioHarmonize app on Render with gated stages."
spec:
  nodes:
    - id: run-on-demand
      name: "Run on demand"
      type: TYPE_TRIGGER
      component: manual          # published manual start trigger (fires on click)
      configuration: {}
      metadata: {}
      position: { x: 80, 'y': 300 }
      isCollapsed: false

    - id: health
      name: "Health check"
      type: TYPE_ACTION
      component: http
      configuration:
        method: GET
        url: "https://biogrid-bioharmonize.onrender.com/api/health"
        successCodes: "2xx"
        timeoutSeconds: 90   # Render free-tier cold start can take 30-60s
      metadata: {}
      position: { x: 360, 'y': 300 }
      isCollapsed: false

    - id: gate-healthy
      name: "Healthy?"
      type: TYPE_ACTION
      component: if
      configuration:
        expression: '$["Health check"].data.body.status == "ok"'
      metadata: {}
      position: { x: 640, 'y': 300 }
      isCollapsed: false

    - id: run
      name: "Run pipeline"
      type: TYPE_ACTION
      component: http
      configuration:
        method: POST
        url: "https://biogrid-bioharmonize.onrender.com/api/pipeline/run"
        body: '{"hospital":"SSKM Kolkata","location":"Kolkata, West Bengal"}'
        successCodes: "2xx"
        timeoutSeconds: 90   # Render free-tier cold start can take 30-60s
      metadata: {}
      position: { x: 920, 'y': 240 }
      isCollapsed: false

    - id: settle
      name: "Wait for pipeline"
      type: TYPE_ACTION
      component: wait
      configuration:
        # SuperPlane wait component: integer Interval + time unit (set in UI)
        interval: 30
        unit: seconds
      metadata: {}
      position: { x: 1200, 'y': 240 }
      isCollapsed: false

    - id: status
      name: "Check status"
      type: TYPE_ACTION
      component: http
      configuration:
        method: GET
        # static URL: backend returns the latest job, so no expression to interpolate
        url: "https://biogrid-bioharmonize.onrender.com/api/pipeline/status/latest"
        successCodes: "2xx"
        timeoutSeconds: 90   # Render free-tier cold start can take 30-60s
      metadata: {}
      position: { x: 1480, 'y': 240 }
      isCollapsed: false

    - id: gate-complete
      name: "Pipeline complete?"
      type: TYPE_ACTION
      component: if
      configuration:
        expression: '$["Check status"].data.body.status == "complete"'
      metadata: {}
      position: { x: 1760, 'y': 240 }
      isCollapsed: false

  edges:
    - sourceId: run-on-demand
      targetId: health
      channel: default
    - sourceId: health
      targetId: gate-healthy
      channel: success
    - sourceId: gate-healthy
      targetId: run
      channel: "true"
    - sourceId: run
      targetId: settle
      channel: success
    - sourceId: settle
      targetId: status
      channel: default
    - sourceId: status
      targetId: gate-complete
      channel: success
