<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioGrid — Live Pipeline Monitor</title>
<style>
  :root{
    --bg:#0a0e14; --panel:#11161f; --line:#1f2733;
    --txt:#e6edf3; --dim:#8b97a7; --cyan:#34d3ee; --gold:#e8b65a; --green:#3fcf8e; --red:#e0605e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#0e1622,#0a0e14);
    color:var(--txt);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
  .wrap{width:100%;max-width:720px}
  .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  h1{font-size:18px;letter-spacing:.32em;font-weight:600;margin:0}
  .sub{color:var(--dim);font-size:12px;letter-spacing:.06em;margin-bottom:22px}
  .sub b{color:var(--cyan);font-weight:600}
  .pill{font-size:11px;letter-spacing:.18em;padding:5px 12px;border-radius:999px;border:1px solid var(--line)}
  .pill.idle{color:var(--dim)} .pill.run{color:var(--cyan);border-color:#1b3a45;background:#0c1c22}
  .pill.done{color:var(--green);border-color:#163a2c;background:#0b1d16}
  .pill.err{color:var(--red)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:middle;background:currentColor}
  .run .dot{animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px}
  .stage{font-size:22px;font-weight:600;letter-spacing:.01em;margin:2px 0 18px;min-height:30px}
  .barwrap{height:12px;background:#0c111a;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .bar{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--gold));
    transition:width .6s cubic-bezier(.2,.7,.2,1)}
  .bar.done{background:linear-gradient(90deg,var(--green),var(--cyan))}
  .pct{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:8px}
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}
  .m{background:#0c111a;border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center}
  .m .v{font-size:26px;font-weight:700;color:var(--gold)}
  .m .k{font-size:10px;letter-spacing:.16em;color:var(--dim);margin-top:4px;text-transform:uppercase}
  .log{margin-top:22px;border-top:1px solid var(--line);padding-top:14px;max-height:150px;overflow:auto}
  .log .row{font-size:12px;color:var(--dim);padding:3px 0}
  .log .row b{color:var(--txt);font-weight:500}
  .foot{margin-top:18px;font-size:11px;color:var(--dim);text-align:center;letter-spacing:.04em}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>BIOGRID</h1>
    <span id="pill" class="pill idle"><span class="dot"></span><span id="pillTxt">CONNECTING…</span></span>
  </div>
  <div class="sub">Live pipeline monitor · trigger a run from the <b>SuperPlane</b> canvas and watch it here</div>

  <div class="card">
    <div id="stage" class="stage">Waiting for a run…</div>
    <div class="barwrap"><div id="bar" class="bar"></div></div>
    <div class="pct"><span id="status">—</span><span id="pctv">0%</span></div>

    <div class="metrics">
      <div class="m"><div class="v" id="mPatients">—</div><div class="k">Patients</div></div>
      <div class="m"><div class="v" id="mEntities">—</div><div class="k">Entities mapped</div></div>
      <div class="m"><div class="v" id="mCorr">—</div><div class="k">Corrections</div></div>
    </div>

    <div class="log" id="log"></div>
  </div>
  <div class="foot">polling <code>/api/pipeline/status/latest</code> · every 1s</div>
</div>

<script>
  const $ = id => document.getElementById(id);
  let lastStage = null, lastStatus = null;

  function setPill(cls, txt){
    const p = $('pill'); p.className = 'pill ' + cls; $('pillTxt').textContent = txt;
  }
  function addLog(stage){
    const row = document.createElement('div');
    row.className = 'row';
    const t = new Date().toLocaleTimeString();
    row.innerHTML = '<b>' + stage + '</b> · ' + t;
    $('log').appendChild(row);
    $('log').scrollTop = $('log').scrollHeight;
  }

  async function tick(){
    try{
      const r = await fetch('/api/pipeline/status/latest', {cache:'no-store'});
      const d = await r.json();
      const status = d.status || 'none';
      const progress = Math.max(0, Math.min(100, d.progress || 0));

      $('stage').textContent = d.stage || (status==='none' ? 'Waiting for a run…' : status);
      $('bar').style.width = progress + '%';
      $('pctv').textContent = progress + '%';
      $('status').textContent = 'status: ' + status;

      if(d.patients){ $('mPatients').textContent = d.patients; }
      if(d.entities){ $('mEntities').textContent = d.entities; }
      if(d.corrections!=null && d.corrections!==0){ $('mCorr').textContent = d.corrections; }

      if(status === 'complete'){
        setPill('done','COMPLETE'); $('bar').classList.add('done');
      } else if(status === 'running' || status === 'queued'){
        setPill('run','RUNNING'); $('bar').classList.remove('done');
        // reset metrics for a fresh run
        if(lastStatus==='complete'||lastStatus==='none'){ $('mPatients').textContent='—';$('mEntities').textContent='—';$('mCorr').textContent='—'; $('log').innerHTML=''; lastStage=null; }
      } else {
        setPill('idle','IDLE');
      }

      if(d.stage && d.stage !== lastStage && status!=='none'){ addLog(d.stage); lastStage = d.stage; }
      lastStatus = status;
    }catch(e){
      setPill('err','OFFLINE');
      $('stage').textContent = 'Cannot reach backend';
    }
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
